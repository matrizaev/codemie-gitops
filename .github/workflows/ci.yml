# CI workflow for codemie-gitops
#
# Supply-chain controls (SEC-006, ADR-005 amendment):
# - Third-party actions are pinned to immutable commit SHAs.
# - Every job has an explicit permissions block (minimum: contents: read).
# - Secrets are not referenced in this file; no secret is available to
#   fork-triggered pull_request jobs.
# - Deployment workflow examples live under examples/ci and are not active in
#   this CLI source repository.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default permissions for all jobs: read-only.
# Each job narrows further if needed.
permissions:
  contents: read

jobs:
  check:
    name: Rust quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout pinned to SHA (SEC-006: no mutable tag references).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Rust tests
        run: make test

      - name: Complete Rust target and feature matrix
        run: cargo test --locked --all-targets --all-features

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Install cargo-audit directly rather than using a third-party action,
      # to avoid an additional SHA-pinned action dependency.
      # cargo install uses --locked to respect Cargo.lock in the audit crate.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Run the RustSec advisory scan. Any unresolved advisory causes a
      # non-zero exit; see ADR-005 amendment for triage policy.
      - name: cargo audit
        run: cargo audit

  version:
    name: Version bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Require package version bump
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$current_version" ]]; then
            echo "Cargo.toml package version is missing" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_version="$(git show "origin/${{ github.base_ref }}:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
            if [[ "$current_version" == "$base_version" ]]; then
              echo "Cargo.toml version must change on every pull request (current: $current_version)" >&2
              exit 1
            fi
            echo "Version bumped: $base_version -> $current_version"
          else
            echo "Version present: $current_version"
          fi
