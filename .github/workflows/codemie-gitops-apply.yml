# O-001 production apply control. Remote protected-environment activation and
# provider mutex drills are adopter responsibilities; see ops/o001/CHECKLIST.md.
name: CodeMie controlled apply

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected target environment (canonical lowercase name)
        required: true
        type: environment
      declaration_path:
        description: Repository-relative declaration path
        required: true
        type: string
      mode:
        description: Apply or exercise the environment mutex without a write
        required: true
        default: apply
        type: choice
        options:
          - apply
          - mutex-drill
      inventory_approved:
        description: Complete-visibility identity inventory is clean and approved
        required: true
        default: false
        type: boolean
      writer_freeze_approved:
        description: UI and other identity writers are frozen for this window
        required: true
        default: false
        type: boolean
      control_evidence:
        description: Non-sensitive ticket or change-control reference
        required: true
        type: string

permissions:
  contents: read

# The target environment is the complete mutex key. queue:max retains waiting
# applies instead of replacing an older pending run.
concurrency:
  group: codemie-gitops-apply-${{ inputs.target_environment }}
  queue: max

jobs:
  prepare:
    name: Test and build the exact apply artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate writer freeze and inventory approval
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          INVENTORY_APPROVED: ${{ inputs.inventory_approved }}
          WRITER_FREEZE_APPROVED: ${{ inputs.writer_freeze_approved }}
          CONTROL_EVIDENCE: ${{ inputs.control_evidence }}
          O001_MODE: ${{ inputs.mode }}
        run: python3 scripts/check_o001_controls.py --ci-preflight

      - name: Install musl toolchain
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools

      - name: Add musl Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Lint locked source
        run: make lint

      - name: Test locked source
        run: make test

      - name: Build locked release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Smoke release binary
        run: ./target/x86_64-unknown-linux-musl/release/codemie-gitops --version

      - name: Stage binary and SHA-256 checksum
        run: |
          mkdir o001-artifact
          install -m 0755 target/x86_64-unknown-linux-musl/release/codemie-gitops o001-artifact/codemie-gitops
          cd o001-artifact
          sha256sum codemie-gitops > codemie-gitops.sha256

      - name: Upload exact tested artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codemie-gitops-${{ github.run_id }}-${{ github.run_attempt }}
          path: o001-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  controlled:
    name: Serialized ${{ inputs.mode }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ inputs.target_environment }}
    steps:
      - name: Exercise mutex without a server write
        if: ${{ inputs.mode == 'mutex-drill' }}
        run: sleep 30

      - name: Checkout exact declaration revision
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download exact tested artifact
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codemie-gitops-${{ github.run_id }}-${{ github.run_attempt }}
          path: o001-artifact

      - name: Verify SHA-256 checksum
        if: ${{ inputs.mode == 'apply' }}
        run: |
          cd o001-artifact
          sha256sum --check --strict codemie-gitops.sha256
          chmod 0555 codemie-gitops

      - name: Apply one declaration under the environment mutex
        if: ${{ inputs.mode == 'apply' }}
        env:
          CODEMIE_URL: ${{ secrets.CODEMIE_URL }}
          CODEMIE_TOKEN: ${{ secrets.CODEMIE_TOKEN }}
          DECLARATION_PATH: ${{ inputs.declaration_path }}
        run: ./o001-artifact/codemie-gitops apply --file "$DECLARATION_PATH" --repo-root "$GITHUB_WORKSPACE"
