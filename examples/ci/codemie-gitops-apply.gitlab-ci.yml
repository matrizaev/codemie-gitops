# Portable controlled-apply example. Production and the staging mutex drill use
# static checked-in environment/resource-group names. Remote protection and
# approval activation remains an adopter responsibility.
stages:
  - codemie-fetch
  - codemie-apply

# Required production assertions. Project policy must restrict pipeline
# variable overrides, and the preflight rejects these safe defaults.
variables:
  CODEMIE_GITOPS_APPLY: "false"
  DECLARATION_PATH: ""
  INVENTORY_APPROVED: "false"
  WRITER_FREEZE_APPROVED: "false"
  CONTROL_EVIDENCE: ""
  CODEMIE_GITOPS_VERSION: "v0.1.0"
  CODEMIE_GITOPS_RELEASE_REPOSITORY: "matrizaev/codemie-gitops"

codemie_gitops_fetch:
  stage: codemie-fetch
  interruptible: false
  rules:
    - if: '$CODEMIE_GITOPS_APPLY == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      asset=codemie-gitops-linux-x86_64
      base="https://github.com/${CODEMIE_GITOPS_RELEASE_REPOSITORY}/releases/download/${CODEMIE_GITOPS_VERSION}"
      mkdir o001-artifact
      curl --fail --silent --show-error --location "$base/$asset" --output "o001-artifact/$asset"
      curl --fail --silent --show-error --location "$base/SHA256SUMS" --output o001-artifact/SHA256SUMS
      cd o001-artifact
      grep -E "^[0-9a-f]{64}  ${asset}$" SHA256SUMS | sha256sum --check --strict -
      mv "$asset" codemie-gitops
      chmod 0555 codemie-gitops
  artifacts:
    name: "codemie-gitops-$CI_PIPELINE_ID-$CI_JOB_ID"
    expire_in: 1 day
    when: on_success
    paths:
      - o001-artifact/codemie-gitops
      - o001-artifact/SHA256SUMS

codemie_gitops_production_apply:
  stage: codemie-apply
  interruptible: false
  needs:
    - job: codemie_gitops_fetch
      artifacts: true
  rules:
    - if: '$CODEMIE_GITOPS_APPLY == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: production
  resource_group: codemie-gitops-apply-production
  tags:
    - codemie-gitops-production-protected
  script:
    - (cd o001-artifact && grep -E '^([0-9a-f]{64})  codemie-gitops-linux-x86_64$' SHA256SUMS | sed 's/codemie-gitops-linux-x86_64$/codemie-gitops/' | sha256sum --check --strict -)
    - ./o001-artifact/codemie-gitops apply --file "$DECLARATION_PATH"

codemie_gitops_production_mutex_drill:
  stage: codemie-apply
  interruptible: false
  needs: []
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CODEMIE_GITOPS_APPLY == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: production
  resource_group: codemie-gitops-apply-production
  tags:
    - codemie-gitops-production-protected
  script:
    - sleep 30

codemie_gitops_staging_mutex_drill:
  stage: codemie-apply
  interruptible: false
  needs: []
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CODEMIE_GITOPS_APPLY == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: staging
  resource_group: codemie-gitops-apply-staging
  tags:
    - codemie-gitops-production-protected
  script:
    - sleep 30
