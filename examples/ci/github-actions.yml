name: CodeMie GitOps portable example

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Build, test, lint examples, and checksum without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          make lint
          make test
          cargo build --locked --release
          python3 scripts/check_o002_examples.py
          install -D -m 0555 target/release/codemie-gitops o002-artifact/codemie-gitops
          ( cd o002-artifact && sha256sum codemie-gitops > codemie-gitops.sha256 )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codemie-gitops-o002
          path: o002-artifact/
          if-no-files-found: error
          overwrite: false

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: codemie-apply
    concurrency:
      group: codemie-gitops-apply-codemie-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codemie-gitops-o002
          path: o002-artifact
      - name: Login once and apply reviewed declarations serially
        shell: bash
        env:
          CODEMIE_URL: ${{ secrets.CODEMIE_URL }}
          CODEMIE_AUTH_URL: ${{ secrets.CODEMIE_AUTH_URL }}
          CODEMIE_CLIENT_ID: ${{ secrets.CODEMIE_CLIENT_ID }}
          CODEMIE_CLIENT_SECRET: ${{ secrets.CODEMIE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          set +x
          ( cd o002-artifact && sha256sum --check --strict codemie-gitops.sha256 )
          cd examples/repository
          token="$(../../o002-artifact/codemie-gitops login)"
          echo "::add-mask::$token"
          export CODEMIE_TOKEN="$token"
          unset CODEMIE_CLIENT_SECRET CODEMIE_PASSWORD
          ../../o002-artifact/codemie-gitops apply --file skills/example-skill.yaml --repo-root .
          ../../o002-artifact/codemie-gitops apply --file assistants/example-assistant.yaml --repo-root .
          ../../o002-artifact/codemie-gitops apply --file workflows/example-workflow.yaml --repo-root .
          unset CODEMIE_TOKEN token
