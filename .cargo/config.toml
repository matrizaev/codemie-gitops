[build]
target = "x86_64-unknown-linux-musl"

# Configure the C compiler for the musl target.
# In CI and release builds, musl-tools must be installed so that musl-gcc is
# available; the [env] entry here ensures cargo check succeeds in environments
# where musl-tools are not installed by falling back to the system gcc for
# compiler-family detection (ring build script). Production musl binaries
# must be built with the real musl-gcc provided by musl-tools.
[env]
CC_x86_64_unknown_linux_musl = { value = "gcc", force = false }
