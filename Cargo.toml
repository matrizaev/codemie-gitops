[package]
name = "codemie-gitops"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "CodeMie declarative CI/CD CLI"
license = "Apache-2.0"

[[bin]]
name = "codemie-gitops"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
jsonschema = "0.29"
url = "2"

[dev-dependencies]
mockito = "1"
