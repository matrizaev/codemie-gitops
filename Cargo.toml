[package]
name = "codemie-gitops"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "CodeMie declarative CI/CD CLI"
license = "Apache-2.0"

[[bin]]
name = "codemie-gitops"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
yaml-rust2 = "0.11"

base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "form",
    "multipart",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
jsonschema = { version = "0.49.9", default-features = false }
url = "2"
uuid = { version = "1", features = ["serde"] }
secrecy = "0.10"
regress = "0.11"

[build-dependencies]
schemars = "0.8"
serde_json = "1"
typify = "0.7"

[dev-dependencies]
mockito = "1"
tempfile = "3"

[lints.rust]
dead_code = "deny"
unsafe_code = "forbid"
